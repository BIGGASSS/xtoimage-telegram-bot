name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --group dev
      - name: Install Chromium, multilingual fonts and ffmpeg
        run: |
          uv run playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji ffmpeg
      - name: Lint and type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Test all handlers, providers, security boundaries and real rendering
        run: uv run pytest -q
      - name: Render visual test cards
        run: uv run python scripts/render_demo.py
      - name: Save visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-previews
          path: docs/examples/*.png
          if-no-files-found: error
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosting image
        run: docker build -t xtoimage-bot:test .
      - name: Smoke test container renderer without credentials
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=256m
          --cap-drop ALL --security-opt no-new-privileges --shm-size=256m
          --entrypoint python xtoimage-bot:test -c
          'import asyncio; from xtoimage_bot.models import Post, RenderAssets;
          from xtoimage_bot.render import Renderer;
          exec("async def smoke():\n r=Renderer()\n await r.start()\n try:\n  png=await r.render(Post(\"20\",\"https://x.com/jack/status/20\",\"Demo\",\"demo\",\"Container render check\"),RenderAssets())\n  assert png.startswith(bytes([137,80,78,71]))\n finally:\n  await r.close()\n");
          asyncio.run(smoke())'
      - name: Smoke test container video encoder
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=256m
          --cap-drop ALL --security-opt no-new-privileges
          --entrypoint sh xtoimage-bot:test -c
          'ffmpeg -hide_banner -encoders | grep -q libx264
          && python -c "from xtoimage_bot.video import VideoComposer; assert VideoComposer().available"'
