name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --group dev
      - name: Lint and type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked --group dev
      - name: Make apt retry on network errors
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries
      - name: Install Chromium and ffmpeg
        run: |
          for attempt in 1 2 3; do
            if uv run playwright install --with-deps chromium \
              && sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "::warning::Install attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::Could not install Chromium and ffmpeg after 3 attempts"
          exit 1
      - name: Test all handlers, providers, security boundaries and real rendering
        run: uv run pytest -q
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosting image
        run: docker build -t xtoimage-bot:test .
      - name: Smoke test container renderer without credentials
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=256m
          --cap-drop ALL --security-opt no-new-privileges --shm-size=256m
          --entrypoint python xtoimage-bot:test -c
          'import asyncio; from xtoimage_bot.models import Post, RenderAssets;
          from xtoimage_bot.render import Renderer;
          exec("async def smoke():\n r=Renderer()\n await r.start()\n try:\n  png=await r.render(Post(\"20\",\"https://x.com/jack/status/20\",\"Demo\",\"demo\",\"Container render check\"),RenderAssets())\n  assert png.startswith(bytes([137,80,78,71]))\n finally:\n  await r.close()\n");
          asyncio.run(smoke())'
      - name: Smoke test container video encoder
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=256m
          --cap-drop ALL --security-opt no-new-privileges
          --entrypoint sh xtoimage-bot:test -c
          'ffmpeg -hide_banner -encoders | grep -q libx264
          && python -c "from xtoimage_bot.video import VideoComposer; assert VideoComposer().available"'
